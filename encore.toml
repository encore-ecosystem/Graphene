[project]
name = "graphene"
version = "0.1.1"
description = "Graphene real-time engine and editor"
readme = "README.md"
licence = "MIT"
build = "build.enq"
encore = ">=0.1.6"
dependencies = ["index@std@>=0.0.5", "index@json@>=0.0.3", "index@linalg@>=0.0.1", "index@binary@>=0.1.0", "index@vulkan@>=0.1.2", "index@luma@>=0.0.3", "index@sdl@>=0.1.0", "index@gpu@>=0.1.2", "index@audio@>=0.1.0", "index@serialize", "index@blaze@>=0.1.0-beta.3", "index@physics@>=0.1.0"]

[publish]
include = ["encore.toml", "src/**", "native/**", "shaders/**", "Assets/**", "styles/**", "graphene.css", "runtime.c", "build.enq", "LICENSE", "README.md"]
exclude = ["**/target/**", "**/.encore_cache/**", "**/.graphene/**"]
