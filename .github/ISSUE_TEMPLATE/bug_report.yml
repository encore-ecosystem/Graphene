name: Bug report
description: Report a reproducible Graphene defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Graphene.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Build revision ...
        2. Open project ...
        3. Perform ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Encore version, GPU, Vulkan driver, compositor, and SDL version where relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Attach logs, screenshots, or a minimal project. Remove sensitive information first.
    validations:
      required: false
