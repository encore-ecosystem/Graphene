name: Linux CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENCORE_RELEASE_TAG: v0.2.1

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Encore 0.2.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/encore-archive"
          install_dir="$RUNNER_TEMP/encore-0.2.1"
          mkdir -p "$archive_dir" "$install_dir"
          gh release download "$ENCORE_RELEASE_TAG" \
            --repo encore-ecosystem/encore \
            --pattern encore-x86_64-unknown-linux-gnu.tar.gz \
            --pattern encore-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            --dir "$archive_dir"
          cd "$archive_dir"
          expected=$(awk 'NF {print tolower($1); exit}' encore-x86_64-unknown-linux-gnu.tar.gz.sha256)
          actual=$(sha256sum encore-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          test "$actual" = "$expected"
          tar -xzf encore-x86_64-unknown-linux-gnu.tar.gz \
            --strip-components=1 \
            -C "$install_dir"
          test -x "$install_dir/bin/encore"
          "$install_dir/bin/encore" --version
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Restore locked dependencies
        run: encore sync

      - name: Check formatting
        run: encore format --check

      - name: Check modules
        run: encore check

      - name: Lint
        run: encore lint

      - name: Test
        run: encore test

      - name: Build
        run: encore build
